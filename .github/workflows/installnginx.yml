name: Install nginx

on:
  push:

jobs:
  installation:
    runs-on: ubuntu-latest

    steps:
      - name: update package
        run: sudo apt update

    
      - name: Install Nginx
        run: sudo apt install -y nginx

  
      - name: check version
        run: nginx -v 

      - name: check nginx binary
        run: which nginx
       
